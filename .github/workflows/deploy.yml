# Rebuilds the site every day so the homepage, sitemaps and popular title
# pages pick up new releases.
#
# On the Workers free plan, pages re-rendered inside the Worker often hit the
# 10 ms CPU limit, so fresh content comes from builds. Cloudflare Workers Builds
# does the build itself; this job only calls its deploy hook on a schedule.
#
# Required repository secret (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_DEPLOY_HOOK_URL   from cinevista -> Settings -> Builds -> Deploy Hooks
name: Daily deploy

on:
  schedule:
    - cron: "0 0 * * *" # 05:00 Pakistan time
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare build
        run: curl --fail-with-body -sS -X POST "${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}"
